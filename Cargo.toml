[package]
name = "gd"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A TUI git diff viewer with side-by-side panes and Neovim-style keybindings"
license = "MIT"
readme = "README.md"
repository = "https://github.com/P1ckingStars/gd"
keywords = ["git", "diff", "tui", "vim"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
similar = "3.2.0"
unicode-width = "0.2.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
